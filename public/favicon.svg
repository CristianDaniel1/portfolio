<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40">
  <style>
    .bg { fill: #f4f0ea; } .frame { fill: none; stroke: #2a2521; stroke-width: 1.2; stroke-opacity: 0.45; } .mat { fill: none; stroke: #2a2521; stroke-opacity: 0.2; }
    text { font-family: Newsreader, Georgia, 'Times New Roman', serif; font-size: 19px; fill: #2a2521; } .d { font-style: italic; fill: #8e2b3b; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #1a1815; } .frame, .mat { stroke: #ece6dd; } text { fill: #ece6dd; } .d { fill: #d98a97; }
    }
  </style>
  <rect class="bg" width="40" height="40" rx="3" />
  <rect class="frame" x="1.5" y="1.5" width="37" height="37" rx="2" />
  <rect class="mat" x="5" y="5" width="30" height="30" />
  <text x="20" y="26.5" text-anchor="middle">C<tspan class="d" dx="0.4">D</tspan></text>
</svg>
